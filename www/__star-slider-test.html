<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Press Start 2P'; src: local('Courier'); }
  body { background: #17120e; padding: 40px; font-family: 'Press Start 2P', monospace; }
  /* --- scene tile stand-in --- */
  .skill-node-wrap { position: relative; width: 150px; display: inline-block; margin: 30px; }
  .scene-tile {
    width: 100%; height: 96px; background: #1d2b1d; border: 2px solid #5c8a5c;
    color: #b0e0a0; font-size: 8px; font-family: inherit;
  }
  .scene-fav-btn {
    position: absolute;
    top: -9px;
    right: -9px;
    z-index: 2;
    width: 26px;
    height: 26px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    color: #8a8a68;
    background: #141414;
    border: 2px solid #5a5a3c;
    cursor: pointer;
  }
  .scene-fav-btn.on { color: #ffd75e; border-color: #ffd75e; background: #241f0d; text-shadow: 0 0 4px #b89b3e; }
  /* --- settings sliders --- */
  .settings-panel { width: 560px; background: #241b13; border: 3px solid #5c4a3a; padding: 20px; margin-top: 20px; }
  .settings-vol-grid { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 10px 12px; }
  .settings-vol-grid label { font-size: 7px; color: #ffd86b; letter-spacing: 1px; white-space: nowrap; }
  .settings-vol-grid input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin: 0;
    background: transparent; cursor: pointer;
  }
  .settings-vol-grid input[type="range"]::-webkit-slider-runnable-track {
    height: 14px; background: #2a2018; border: 3px solid #5c4a3a;
    box-shadow: 0 0 0 2px #1a1210, inset 0 -3px 0 rgba(0,0,0,0.38);
  }
  .settings-vol-grid input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 22px; margin-top: -7px;
    background: #ffd86b; border: 2px solid #1a1210; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3);
  }
  /* comparison button (settings style) */
  .ref-btn {
    width: 200px; height: 42px; display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 9px; color: #ffd86b; background: #2a2018;
    border: 3px solid #5c4a3a; box-shadow: 0 0 0 2px #1a1210, inset 0 -3px 0 rgba(0,0,0,0.38);
    letter-spacing: 1px; margin-top: 16px;
  }
</style>
<div class="skill-node-wrap">
  <button class="scene-tile">SCENE TILE</button>
  <button class="scene-fav-btn on">★</button>
</div>
<div class="skill-node-wrap">
  <button class="scene-tile">SCENE TILE</button>
  <button class="scene-fav-btn">☆</button>
</div>
<div class="settings-panel">
  <div class="settings-vol-grid">
    <label>SFX VOLUME</label><input type="range" value="40">
    <label>SEX SFX VOLUME</label><input type="range" value="55">
    <label>MUSIC VOLUME</label><input type="range" value="85">
  </div>
  <button class="ref-btn">REFERENCE BUTTON</button>
</div>
